[project]
name = "agy-proxy"
version = "1.0.2"
description = "High-performance OpenAI and Anthropic compatible proxy server for Google Antigravity & Gemini Code Assist."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "sse-starlette>=2.0.0",
    "jinja2>=3.1.0",
]

[project.scripts]
agy-proxy = "agy_proxy.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agy_proxy*"]
