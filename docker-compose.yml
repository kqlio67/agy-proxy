services:
  agy-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agy-proxy
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PROXY_API_KEY= # Optional: Set to secure proxy access
    volumes:
      # Persist secondary accounts and pool configurations
      - ~/.config/agy-proxy:/home/appuser/.config/agy-proxy
      # Mount primary Antigravity CLI OAuth token (optional)
      - ~/.gemini/antigravity-cli:/home/appuser/.gemini/antigravity-cli:ro
