name: Build & Release Standalone Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            artifact_name: agy-proxy-linux-amd64
            asset_name: agy-proxy-linux-amd64.tar.gz
          - os: ubuntu-24.04-arm # Native Linux ARM64 (Raspberry Pi, ARM64 Servers)
            arch: arm64
            artifact_name: agy-proxy-linux-arm64
            asset_name: agy-proxy-linux-arm64.tar.gz
          - os: windows-latest
            arch: amd64
            artifact_name: agy-proxy-windows-amd64
            asset_name: agy-proxy-windows-amd64.zip
          - os: macos-14 # Apple Silicon (M1/M2/M3/M4)
            arch: arm64
            artifact_name: agy-proxy-darwin-arm64
            asset_name: agy-proxy-darwin-arm64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build standalone executable
        env:
          PYTHONIOENCODING: "utf-8"
          PYTHONUTF8: "1"
        run: |
          python build_binary.py

      - name: Package artifacts (Linux & macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar -czvf "../${{ matrix.asset_name }}" agy-proxy

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          Compress-Archive -Path agy-proxy.exe -DestinationPath "../${{ matrix.asset_name }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}

  package-python:
    name: Build Python Wheel & SDist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Wheel and Source Tarball
        run: |
          python -m build

      - name: Upload Python Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: [build, package-python]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Flatten and generate SHA256 Checksums
        run: |
          mkdir -p final_assets
          find release_assets/ -type f -exec mv -t final_assets/ {} +
          cd final_assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Binaries & Checksums to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final_assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build & Push Docker Image
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
